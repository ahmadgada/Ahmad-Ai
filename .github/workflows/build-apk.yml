name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== JAVA_HOME ==="
          echo "JAVA_HOME: $JAVA_HOME"

          JAVA_VER_OUTPUT=$(java -version 2>&1)
          JAVA_MAJOR=$(echo "$JAVA_VER_OUTPUT" | sed -nE 's/.*version "([0-9]+).*/\1/p' | head -n 1)

          if [ -z "$JAVA_MAJOR" ]; then
            echo "ERROR: Failed to detect active Java major version."
            exit 1
          fi

          echo "Detected Java major version: $JAVA_MAJOR"

          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Java major version ($JAVA_MAJOR) is lower than 17."
            exit 1
          fi

          echo "Java environment verified: version $JAVA_MAJOR is >= 17."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists, skipping generation."
          else
            echo "Generating temporary debug.keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: ./debug.keystore does not exist after creation attempt!"
            exit 1
          fi

          echo "Temporary debug.keystore verified successfully."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected debug APK not found at: $EXPECTED_APK"
            echo "Discovered APKs in app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -name "*.apk" -type f
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: $EXPECTED_APK is not a regular file."
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: Discovered APK is empty (0 bytes): $EXPECTED_APK"
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "ERROR: File does not have .apk extension: $EXPECTED_APK"
              exit 1
              ;;
          esac

          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: Selected APK ($EXPECTED_APK) is not exactly app/build/outputs/apk/debug/app-debug.apk."
            exit 1
          fi

          echo "Verified APK at $EXPECTED_APK (size: $(wc -c < "$EXPECTED_APK") bytes)."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_release
        run: |
          TEMP_ASSET_DIR="${RUNNER_TEMP}/apk-release-asset"
          mkdir -p "$TEMP_ASSET_DIR"

          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SANITIZED_REPO=$(echo "$RAW_REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_-]+/-/g' | sed -E 's/^-+|-+$//g')
          if [ -z "$SANITIZED_REPO" ]; then
            SANITIZED_REPO="android-app"
          fi

          ASSET_FILENAME="${SANITIZED_REPO}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_PATH="${TEMP_ASSET_DIR}/${ASSET_FILENAME}"

          cp "app/build/outputs/apk/debug/app-debug.apk" "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Failed to prepare release asset at: $ASSET_PATH"
            exit 1
          fi

          echo "Prepared release asset: $ASSET_PATH"
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking GitHub CLI..."
          gh --version

          ASSET_PATH="${{ steps.prepare_release.outputs.asset_path }}"
          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ]; then
            echo "ERROR: Prepared release asset does not exist: '$ASSET_PATH'"
            exit 1
          fi

          if [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Prepared release asset is empty: '$ASSET_PATH'"
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "ERROR: Prepared release asset does not have .apk extension: '$ASSET_PATH'"
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          RELEASE_NOTES=$(cat <<EOF
          ### Automated Debug APK Build

          - **Build Type:** Automatically generated debug APK
          - **Builder:** GitHub Actions
          - **Run Number:** ${GITHUB_RUN_NUMBER}
          - **Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Source Commit:** ${GITHUB_SHA}

          > **Notice:**
          > - This is an automatically generated debug APK.
          > - The APK was built by GitHub Actions.
          > - The GitHub Actions run number: ${GITHUB_RUN_NUMBER}
          > - The GitHub Actions run attempt: ${GITHUB_RUN_ATTEMPT}
          > - The source commit SHA: \`${GITHUB_SHA}\`
          > - The APK is intended for testing.
          > - The APK is not a Play Store production release.
          > - The APK is signed only with a temporary debug keystore.
          EOF
          )

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PUBLISH_OUTCOME="${{ steps.publish_release.outcome }}"
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          ASSET_NAME="${{ steps.prepare_release.outputs.asset_name }}"

          if [ "$PUBLISH_OUTCOME" = "success" ]; then
            echo "=== GitHub Release Succeeded ==="
            gh release view "$RELEASE_TAG"

            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url)
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release Page URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"

            {
              echo "## 🚀 Debug APK Build & Release Succeeded"
              echo ""
              echo "The debug APK was built and published to GitHub Releases successfully."
              echo ""
              echo "- **Release Page:** [$RELEASE_TITLE]($RELEASE_URL)"
              echo "- **Release Tag:** \`$RELEASE_TAG\`"
              echo "- **Direct APK Asset:** \`$ASSET_NAME\`"
              echo ""
              echo "### 📲 Download Instructions"
              echo "You can download the APK directly from the **Assets** section of the [GitHub Release page]($RELEASE_URL) to your phone."
              echo ""
              echo "The normal GitHub Actions workflow artifact (\`app-debug-apk\`) is also preserved and available as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed or was skipped. However, the debug APK build succeeded and the artifact was uploaded."
            echo "APK build succeeded: app/build/outputs/apk/debug/app-debug.apk"
            echo "Actions artifact named 'app-debug-apk' remains available."

            {
              echo "## ⚠️ Debug APK Build Notice"
              echo ""
              echo "The debug APK was built successfully, but publishing to GitHub Releases encountered an error or was skipped."
              echo ""
              echo "### 📦 Backup Artifact Available"
              echo "The compiled debug APK is safely preserved as a normal GitHub Actions artifact named **app-debug-apk** in this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
